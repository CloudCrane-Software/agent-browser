[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-browser"
version = "0.1.0"
description = "Atomic browser capability pack with pluggable drivers (agent-browser repo, WO-0008)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# search/fetch/extract/server 子包需要（核心 driver/sessions/task 保持零依赖）
search = ["httpx>=0.27", "beautifulsoup4>=4.12"]
test = ["pytest>=7", "httpx>=0.27", "beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
where = ["src"]
