# agent-browser CI 门禁（D1 修复轮：此前本仓 26 例回归零自动门禁——无 .github/
# 目录，直接 push 本仓不触发任何检查；对齐 D1-R1 先例：session-broker/skill-pack
# 各有 ci.yml，glue ci.yml 同款门禁动机）。
# 元资产纪律（PROP-0001 v2.1 §11/§14）：本文件改动强制 owner PR 审（zizmor 常开）。
# 口径：仓根裸 pytest 全量，floor 断言随上游如实核查回填（只升不降，不许静默放行）；
# 当前 floor=26 对应 main=95869cd 本地实测 26 passed（test_sessions 8 + test_task 18）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # 线3（search 能力）：search/fetch/extract/server 子包依赖 httpx+bs4，
        # 走 [search] extra；【元资产改动——强制 owner 审，见文件头纪律】
        run: python -m pip install --upgrade pip && python -m pip install pytest -e .[search]
      - name: pytest with floor
        run: |
          set -e
          python -m pytest > pytest.log 2>&1 || { tail -30 pytest.log; exit 1; }
          tail -3 pytest.log
          N="$(grep -oE '[0-9]+ passed' pytest.log | tail -1 | grep -oE '[0-9]+')"
          [ -n "$N" ] || { echo "cannot parse passed count"; tail -30 pytest.log; exit 1; }
          [ "$N" -ge 26 ] || { echo "passed=$N < 26 (upstream changed? re-verify and re-ratchet, never silently loosen)"; exit 1; }
          echo "agent-browser floor OK: $N passed (>= 26)"
