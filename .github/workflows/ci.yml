# agent-browser CI 门禁（D1 修复轮：此前本仓 26 例回归零自动门禁——无 .github/
# 目录，直接 push 本仓不触发任何检查；对齐 D1-R1 先例：session-broker/skill-pack
# 各有 ci.yml，glue ci.yml 同款门禁动机）。
# 元资产纪律（PROP-0001 v2.1 §11/§14）：本文件改动强制 owner PR 审（zizmor 常开）。
# 口径：仓根裸 pytest 全量，floor 断言随上游如实核查回填（只升不降，不许静默放行）；
# 当前 floor=76 对应 bfix-R1 修复分支本地实测 76 passed（f7c2d24 基线 73 + 点击/
# 重定向落点闸 3 例；floor 26→76 补棘轮：f7c2d24 时点实为 73，此前未随 PR #4/#6/#7 回填）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install pytest -e .
      - name: pytest with floor
        run: |
          set -e
          python -m pytest > pytest.log 2>&1 || { tail -30 pytest.log; exit 1; }
          tail -3 pytest.log
          N="$(grep -oE '[0-9]+ passed' pytest.log | tail -1 | grep -oE '[0-9]+')"
          [ -n "$N" ] || { echo "cannot parse passed count"; tail -30 pytest.log; exit 1; }
          [ "$N" -ge 76 ] || { echo "passed=$N < 76 (upstream changed? re-verify and re-ratchet, never silently loosen)"; exit 1; }
          echo "agent-browser floor OK: $N passed (>= 76)"
